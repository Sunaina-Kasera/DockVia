<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DockVia</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="topbar">

        <div class="brand">

            <div class="brand-logo">
                <span></span>
            </div>

            <span>DockVia</span>

        </div>


        <div class="top-actions">

            <!-- Search -->

            <button
                class="icon-btn"
                onclick="toggleSearch()"
                aria-label="Search">

                <span class="search-icon"></span>

            </button>


            <!-- Menu -->

            <button
                class="icon-btn menu-trigger"
                onclick="toggleMenu()"
                aria-label="Menu">

                <span></span>
                <span></span>
                <span></span>

            </button>

        </div>

    </header>



    <!-- ================= SEARCH ================= -->

    <div id="search-box" class="search-box">

        <input
            id="search-input"
            type="text"
            placeholder="Search containers, images, volumes..."
        >

    </div>



    <!-- ================= SIDE MENU ================= -->

    <aside id="side-menu" class="side-menu">

        <div class="menu-header">

            <div class="menu-brand">

                <div class="brand-logo small">
                    <span></span>
                </div>

                <span>DockVia</span>

            </div>


            <button
                class="close-menu"
                onclick="closeMenu()"
                aria-label="Close menu">

                ×

            </button>

        </div>


        <nav class="menu-nav">

            <!-- Inventory -->

            <a href="/inventory" onclick="closeMenu()">

                <span class="nav-icon inventory-icon"></span>

                <span>Inventory</span>

            </a>


            <!-- Monitor -->

            <a href="/monitor" onclick="closeMenu()">

                <span class="nav-icon monitor-icon"></span>

                <span>Monitor</span>

            </a>


            <!-- Analyzer -->

            <a href="/analyzer" onclick="closeMenu()">

                <span class="nav-icon analyzer-icon"></span>

                <span>Analyzer</span>

            </a>


            <!-- Security -->

            <a href="/security" onclick="closeMenu()">

                <span class="nav-icon security-icon"></span>

                <span>Security</span>

            </a>


            <!-- Recovery -->

            <a href="/recovery" onclick="closeMenu()">

                <span class="nav-icon recovery-icon"></span>

                <span>Recovery</span>

            </a>


            <!-- Reports -->

            <a href="/reports" onclick="closeMenu()">

                <span class="nav-icon reports-icon"></span>

                <span>Reports</span>

            </a>

        </nav>

    </aside>



    <!-- ================= OVERLAY ================= -->

    <div
        id="overlay"
        class="overlay"
        onclick="closeMenu()">
    </div>



    <!-- ================= MAIN PAGE ================= -->

    <main class="home">


        <!-- =================================================
             LEFT SIDE
        ================================================= -->

        <section class="hero-text">

            <div class="eyebrow">
                DOCKER OPERATIONS PLATFORM
            </div>


            <div class="title-row">

                <h1>DockVia</h1>

                <div class="hero-logo">

                    <span></span>

                </div>

            </div>


            <h2>

                Docker Operations

                <span>& Visibility</span>

            </h2>


            <p>

                Monitor, analyze, secure and recover
                your Docker environment from one place.

            </p>


            <div class="hero-line"></div>

        </section>



        <!-- =================================================
             DOCKER VISUAL / ANIMATION
        ================================================= -->

        <section class="docker-scene">

            <div class="docker-whale">
    <img src="{{ url_for('static', filename='images/whale.7.png') }}" alt="Docker whale">
            </div>

            <div class="engine-status">
                <span></span>
                <span class="engine-text">
                    Docker Engine
                </span>
                <strong>
                    Connected
                </strong>
            </div>

        </section>



        <!-- =================================================
             STATUS BAR
        ================================================= -->

        <section class="status-bar">


            <!-- Running -->

            <div class="status-item">

                <div class="status-symbol running"></div>

                <div>

                    <small>
                        Running
                    </small>

                    <strong id="running-count">
                        --
                    </strong>

                </div>

            </div>


            <div class="status-divider"></div>


            <!-- Stopped -->

            <div class="status-item">

                <div class="status-symbol stopped"></div>

                <div>

                    <small>
                        Stopped
                    </small>

                    <strong id="stopped-count">
                        --
                    </strong>

                </div>

            </div>


            <div class="status-divider"></div>


            <!-- Images -->

            <div class="status-item">

                <div class="status-symbol images"></div>

                <div>

                    <small>
                        Images
                    </small>

                    <strong id="image-count">
                        --
                    </strong>

                </div>

            </div>


            <div class="status-divider"></div>


            <!-- Health -->

            <div class="status-item">

                <div class="status-symbol health">
                    ♥
                </div>

                <div>

                    <small>
                        Health
                    </small>

                    <strong id="health-score">
                        --
                    </strong>

                </div>

            </div>

        </section>

    </main>



    <!-- ================= JAVASCRIPT ================= -->

    <script
        src="{{ url_for('static', filename='js/app.js') }}">
    </script>

</body>

</html>
